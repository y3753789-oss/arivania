<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة أريڤانيا | ARIVANIA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0713;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            opacity: 0.15;
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }
        .kingdom-title {
            font-size: 2.8rem;
            color: #f3e5ab;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(243, 229, 171, 0.4);
        }
        .kingdom-subtitle {
            font-size: 1.1rem;
            color: #b1a9c2;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .verse {
            font-size: 0.95rem;
            color: #d4af37;
            margin-bottom: 40px;
            font-style: italic;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding: 10px 0;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #4b2e83, #2b174f);
            color: #ffffff;
            padding: 14px 35px;
            border: 1px solid #d4af37;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(75, 46, 131, 0.5);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: linear-gradient(135deg, #5d399e, #361c63);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <h1 class="kingdom-title">مملكة أريڤانيا</h1>
        <p class="kingdom-subtitle">حيث لا تمنح المكانة بالاسم، بل بما يتركه صاحبها خلفه. مملكة جمعت النقابات، القادة، الملوك، وصانعي التاريخ تحت راية واحدة.</p>
        
        <div class="verse">
            "وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا" <br>آل عمران - 103
        </div>

        <a href="#" class="btn" onclick="alert('قريباً سيتم افتتاح أبواب قاعة السلطة العليا والنقابات!')">دخول المملكة</a>
    </div>

</body>
</html>
